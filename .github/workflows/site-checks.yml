name: Site checks

# Runs on every push and PR so a bad commit (deleted sections, broken tags,
# dead links) is caught before GitHub Pages publishes it.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate HTML
        run: npx --yes html-validate@9 "*.html"

  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check internal links and assets
        uses: lycheeverse/lychee-action@v2
        with:
          # --offline: only local files/anchors, so external sites being slow never fails the build
          args: --offline --root-dir "${{ github.workspace }}" --include-fragments --no-progress "*.html"
          fail: true

  guard-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Key sections still present
        run: |
          set -e
          grep -q 'data-time' index.html || { echo "::error::Time-of-day theme script missing"; exit 1; }
          for f in index.html work.html impact.html case-botim.html case-dopay.html case-novo.html life.html; do
            grep -q 'rel="canonical"' "$f" || { echo "::error::$f has no canonical tag"; exit 1; }
            grep -q 'property="og:image"' "$f" || { echo "::error::$f has no og:image"; exit 1; }
          done
          test -f sitemap.xml && test -f 404.html
          python3 scripts/version-assets.py
          git diff --exit-code -- '*.html' || { echo "::error::CSS/JS version tags are stale - run: python3 scripts/version-assets.py"; exit 1; }
          if grep -nE 'href="#"' *.html; then echo "::error::Placeholder href=\"#\" links found"; exit 1; fi
